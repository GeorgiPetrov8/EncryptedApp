# FIX (Critical #2): regenerated project definition.
#
# The checked-in `.xcodeproj` contained none of the settings this file
# declares — no `API_BASE_URL`, no `USE_MOCK_BACKEND`, no `UIBackgroundModes`,
# no `NSFaceIDUsageDescription`, no `NSAllowsLocalNetworking`, no
# `CODE_SIGN_ENTITLEMENTS`. The project had been generated before those were
# added and never regenerated, so the app shipped with:
#
#   - `useMockBackend == false` and a base URL of nothing, pointing it at a
#     server that isn't running → registration fails on first launch;
#   - no `audio` background mode → the alarm goes silent the moment the user
#     swipes to the home screen, which is the obvious bypass the feature
#     exists to prevent;
#   - no Data Protection entitlement → the file-protection attributes the
#     database sets have nothing backing them.
#
# The paths below are also corrected: the previous file pointed at
# `Sources/HyperChat/Info.plist`, `Tests/HyperChatTests` and
# `Sources/HyperChat/HyperChat.entitlements`, none of which match the actual
# layout, so `xcodegen generate` failed outright.
#
# ⚠️ Adjust `sources.path` and the `info`/`entitlements` paths to match your
# tree before running `xcodegen generate`, then verify with:
#
#     grep -c "USE_MOCK_BACKEND\|UIBackgroundModes\|CODE_SIGN_ENTITLEMENTS" \
#         HyperChat.xcodeproj/project.pbxproj
#
# A result of 0 means the regeneration didn't take.

name: HyperChat
options:
  bundleIdPrefix: com.hyperchat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
  configs:
    Debug:
      API_BASE_URL: "http://127.0.0.1:8080"
      # Real backend by default even in Debug, so the mock can't be shipped by
      # accident. Use the HyperChat-Mock scheme below for UI work without a
      # server running.
      USE_MOCK_BACKEND: "NO"
    Release:
      API_BASE_URL: "https://chat.yourdomain.example"
      USE_MOCK_BACKEND: "NO"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.29.0

targets:
  HyperChat:
    type: application
    platform: iOS
    sources:
      - path: HyperChat/Sources/HyperChat
    dependencies:
      - package: GRDB
        product: GRDB
    info:
      path: HyperChat/Sources/HyperChat/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

        NSCameraUsageDescription: "HyperChat needs camera access to capture photos and videos to send in encrypted messages."
        NSPhotoLibraryUsageDescription: "HyperChat needs photo library access to attach images, set a profile picture, and choose a chat background."
        NSFaceIDUsageDescription: "HyperChat uses Face ID to protect access to your conversations."

        # Read by `NetworkConfiguration`. `$(...)` is substituted from the
        # per-configuration settings above at build time.
        API_BASE_URL: "$(API_BASE_URL)"
        USE_MOCK_BACKEND: "$(USE_MOCK_BACKEND)"

        # Permits plain HTTP to local-network addresses only (loopback,
        # private ranges, `.local`). Does not weaken ATS against internet
        # hosts, so it is safe to keep in Release — a Release build pointed at
        # an https:// domain never exercises it.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

        # Keeps the alarm sounding when the app is backgrounded mid-challenge.
        # Without it, swiping to the home screen silences the alarm instantly.
        UIBackgroundModes:
          - audio

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hyperchat.app
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        # Required for the NSFileProtection attributes on the database and
        # caches to take effect.
        CODE_SIGN_ENTITLEMENTS: HyperChat/Sources/HyperChat/HyperChat.entitlements

  HyperChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HyperChat/Tests/HyperChatTests
    dependencies:
      - target: HyperChat

schemes:
  HyperChat:
    build:
      targets:
        HyperChat: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HyperChatTests

  # Same build, one environment variable different — switching to the in-memory
  # mock for UI work is picking a scheme, not editing a plist and rebuilding.
  HyperChat-Mock:
    build:
      targets:
        HyperChat: all
    run:
      config: Debug
      environmentVariables:
        USE_MOCK_BACKEND: "YES"
    test:
      config: Debug
      targets:
        - HyperChatTests
