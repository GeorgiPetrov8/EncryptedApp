# ios/project.yml
#
# Generate the Xcode project with:   cd ios && xcodegen generate
# ios/SecureHyperChat.xcodeproj is generated output and is git-ignored. This file
# is the single source of truth for targets, schemes and build settings.
#
# All paths below are relative to this file (ios/).

name: SecureHyperChat
options:
  bundleIdPrefix: com.SecureHyperChat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # GIF provider. Put your key from partner.klipy.com here (or in Xcode ->
    # Build Settings -> User-Defined). Never commit a real key.
    GIF_API_KEY: ""
    GIF_API_HOST: "api.klipy.com"
  configs:
    Debug:
      API_BASE_URL: "http://127.0.0.1:8080" #TODO CHANGE
      USE_MOCK_BACKEND: "NO"
    Release:
      API_BASE_URL: "https://chat.yourdomain.example"
      USE_MOCK_BACKEND: "NO"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.29.0
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    branch: latest

targets:
  SecureHyperChat:
    type: application
    platform: iOS
    sources:
      - path: SecureHyperChat
        excludes:
          - Resources/Info.plist
          # The catalog was not part of the target before the restructure.
          # Remove this line once it contains a real AppIcon, and set
          # ASSETCATALOG_COMPILER_APPICON_NAME below.
          - Resources/Assets.xcassets
          - "**/*.entitlements"
      # ScreenShareWire.swift is compiled into the app and the extension.
      - path: Shared
    dependencies:
      - package: GRDB
        product: GRDB
      - package: WebRTC
        product: WebRTC
      - target: SecureHyperChatScreenShare
        embed: true
    info:
      path: SecureHyperChat/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "SecureHyperChat needs camera access to capture photos and videos to send in encrypted messages."
        NSPhotoLibraryUsageDescription: "SecureHyperChat needs photo library access to attach images and videos to encrypted messages."
        # Needed for "Save Image" / "Save Video" from the share sheet. Without
        # it iOS terminates the app on the first save.
        NSPhotoLibraryAddUsageDescription: "SecureHyperChat saves photos and videos you choose to your library."
        NSMicrophoneUsageDescription: "SecureHyperChat needs microphone access for calls and voice messages."
        NSFaceIDUsageDescription: "SecureHyperChat uses Face ID to protect access to your conversations."
        NSPhotoLibraryAddUsageDescription: "SecureHyperChat saves photos and videos you choose to your library."
        API_BASE_URL: "$(API_BASE_URL)"
        USE_MOCK_BACKEND: "$(USE_MOCK_BACKEND)"
        GIF_API_KEY: "$(GIF_API_KEY)"
        GIF_API_HOST: "$(GIF_API_HOST)"
        # The server's ntfy notifications set Click: hyperchat:// — tapping one
        # opens this app only if the scheme is registered here.
        CFBundleURLTypes:
          - CFBundleURLName: com.SecureHyperChat.app
            CFBundleURLSchemes:
              - hyperchat
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.SecureHyperChat.app
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: SecureHyperChat/Resources/SecureHyperChat.entitlements

  # Broadcast Upload Extension for screen sharing.
  SecureHyperChatScreenShare:
    type: app-extension
    platform: iOS
    sources:
      - path: SecureHyperChatScreenShare
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared/ScreenShareWire.swift
    info:
      path: SecureHyperChatScreenShare/Info.plist
      properties:
        CFBundleDisplayName: "SecureHyperChat Screen Share"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SampleHandler"
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.SecureHyperChat.app.SecureHyperChatScreenShare

  SecureHyperChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SecureHyperChatTests
    dependencies:
      - target: SecureHyperChat

schemes:
  SecureHyperChat:
    build:
      targets:
        SecureHyperChat: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SecureHyperChatTests
  SecureHyperChat-Mock:
    build:
      targets:
        SecureHyperChat: all
    run:
      config: Debug
      environmentVariables:
        USE_MOCK_BACKEND: "YES"
    test:
      config: Debug
      targets:
        - SecureHyperChatTests
