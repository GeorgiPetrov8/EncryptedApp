# ios/project.yml
#
# Generate the Xcode project with:   cd ios && xcodegen generate
# ios/HyperChat.xcodeproj is generated output and is git-ignored. This file
# is the single source of truth for targets, schemes and build settings.
#
# All paths below are relative to this file (ios/).

name: HyperChat
options:
  bundleIdPrefix: com.HyperChat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # GIF provider. Put your key from partner.klipy.com here (or in Xcode ->
    # Build Settings -> User-Defined). Never commit a real key.
    GIF_API_KEY: ""
    GIF_API_HOST: "api.klipy.com"
  configs:
    Debug:
      API_BASE_URL: "http://127.0.0.1:8080"
      USE_MOCK_BACKEND: "NO"
    Release:
      API_BASE_URL: "https://chat.yourdomain.example"
      USE_MOCK_BACKEND: "NO"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.29.0
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    branch: latest

targets:
  HyperChat:
    type: application
    platform: iOS
    sources:
      - path: HyperChat
        excludes:
          - Resources/Info.plist
          # The catalog was not part of the target before the restructure.
          # Remove this line once it contains a real AppIcon, and set
          # ASSETCATALOG_COMPILER_APPICON_NAME below.
          - Resources/Assets.xcassets
          - "**/*.entitlements"
      # ScreenShareWire.swift is compiled into the app and the extension.
      - path: Shared
    dependencies:
      - package: GRDB
        product: GRDB
      - package: WebRTC
        product: WebRTC
      - target: HyperChatScreenShare
        embed: true
    info:
      path: HyperChat/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "HyperChat needs camera access to capture photos and videos to send in encrypted messages."
        NSPhotoLibraryUsageDescription: "HyperChat needs photo library access to attach images and videos to encrypted messages."
        # Needed for "Save Image" / "Save Video" from the share sheet. Without
        # it iOS terminates the app on the first save.
        NSPhotoLibraryAddUsageDescription: "HyperChat saves photos and videos you choose to your library."
        NSMicrophoneUsageDescription: "HyperChat needs microphone access for calls and voice messages."
        NSFaceIDUsageDescription: "HyperChat uses Face ID to protect access to your conversations."
        NSPhotoLibraryAddUsageDescription: "HyperChat saves photos and videos you choose to your library."
        API_BASE_URL: "$(API_BASE_URL)"
        USE_MOCK_BACKEND: "$(USE_MOCK_BACKEND)"
        GIF_API_KEY: "$(GIF_API_KEY)"
        GIF_API_HOST: "$(GIF_API_HOST)"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.HyperChat.app
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: HyperChat/Resources/HyperChat.entitlements

  # Broadcast Upload Extension for screen sharing.
  HyperChatScreenShare:
    type: app-extension
    platform: iOS
    sources:
      - path: HyperChatScreenShare
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared/ScreenShareWire.swift
    info:
      path: HyperChatScreenShare/Info.plist
      properties:
        CFBundleDisplayName: "HyperChat Screen Share"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SampleHandler"
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.HyperChat.app.HyperChatScreenShare

  HyperChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/HyperChatTests
    dependencies:
      - target: HyperChat

schemes:
  HyperChat:
    build:
      targets:
        HyperChat: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HyperChatTests
  HyperChat-Mock:
    build:
      targets:
        HyperChat: all
    run:
      config: Debug
      environmentVariables:
        USE_MOCK_BACKEND: "YES"
    test:
      config: Debug
      targets:
        - HyperChatTests
