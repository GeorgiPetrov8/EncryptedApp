name: HyperChat
options:
  bundleIdPrefix: com.HyperChat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
  configs:
    Debug:
      API_BASE_URL: "http://127.0.0.1:8080"
      USE_MOCK_BACKEND: "NO"
    Release:
      API_BASE_URL: "https://chat.yourdomain.example"
      USE_MOCK_BACKEND: "NO"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.29.0
targets:
  HyperChat:
    type: application
    platform: iOS
    sources:
      - path: Sources/HyperChat
    dependencies:
      - package: GRDB
        product: GRDB
    info:
      path: Sources/HyperChat/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "HyperChat needs camera access to capture photos and videos to send in encrypted messages."
        NSPhotoLibraryUsageDescription: "HyperChat needs photo library access to attach images and videos to encrypted messages."
        NSMicrophoneUsageDescription: "HyperChat needs microphone access to record voice messages."
        NSFaceIDUsageDescription: "HyperChat uses Face ID to protect access to your conversations."
        API_BASE_URL: "$(API_BASE_URL)"
        USE_MOCK_BACKEND: "$(USE_MOCK_BACKEND)"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # FIX (alarm): keeps the alarm sound playing when the app is
        # backgrounded mid-challenge.
        #
        # Without this, swiping up to the home screen silences the alarm
        # instantly — a bypass requiring no thought at all, which would make
        # the whole "can't dismiss without solving something" premise
        # decorative. With it, the audio session survives backgrounding and
        # the user has to come back and finish.
        #
        # Note for App Review: this is a legitimate use of the audio
        # background mode (an alarm clock is one of Apple's own listed
        # examples), but be ready to explain it — background audio is
        # scrutinised, and "it's an alarm" needs to be evident from the UI,
        # which `AlarmRingingView` makes it.
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.HyperChat.app
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_ENTITLEMENTS: Sources/HyperChat/HyperChat.entitlements
  HyperChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/HyperChatTests
    dependencies:
      - target: HyperChat
schemes:
  HyperChat:
    build:
      targets:
        HyperChat: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HyperChatTests
  HyperChat-Mock:
    build:
      targets:
        HyperChat: all
    run:
      config: Debug
      environmentVariables:
        USE_MOCK_BACKEND: "YES"
    test:
      config: Debug
      targets:
        - HyperChatTests
