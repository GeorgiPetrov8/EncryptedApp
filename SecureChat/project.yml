name: SecureChat
options:
  bundleIdPrefix: com.securechat
  # FIX (Bug #19), Variant A: raised from 16.0.
  #
  # `ConversationListView` uses `ContentUnavailableView` and
  # `.navigationDestination(item:)`, both iOS 17+, so the project could not compile
  # against a 16.0 target — the README's admission that it had never been built.
  #
  # Raising the target is preferable to rewriting those call sites: the iOS 16
  # workarounds (a hand-rolled empty state, and `navigationDestination(isPresented:)`
  # with a parallel `@State`) are strictly more code for a scaffold with no installed
  # base to preserve. It also lets the deprecated one-parameter `onChange` calls move
  # to the two-parameter form (Bug #26) without availability branching.
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.29.0
targets:
  SecureChat:
    type: application
    platform: iOS
    sources:
      - path: Sources/SecureChat
    dependencies:
      - package: GRDB
        product: GRDB
    info:
      path: Sources/SecureChat/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "SecureChat needs camera access to capture photos and videos to send in encrypted messages."
        NSPhotoLibraryUsageDescription: "SecureChat needs photo library access to attach images and videos to encrypted messages."
        NSFaceIDUsageDescription: "SecureChat uses Face ID to protect access to your conversations."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.securechat.app
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        # Required for the NSFileProtectionCompleteUntilFirstUserAuthentication
        # attribute on the database and media cache to take effect (Bugs #22, #23).
        CODE_SIGN_ENTITLEMENTS: Sources/SecureChat/SecureChat.entitlements
  SecureChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SecureChatTests
    dependencies:
      - target: SecureChat
schemes:
  SecureChat:
    build:
      targets:
        SecureChat: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SecureChatTests
